[build]
# macOS: link against system libraries dynamically (static linking of libc on macOS is unsupported)
# The binary is still self-contained for all Rust code; only libc/libSystem link dynamically,
# which is always present on macOS.

[alias]
flock = "run --bin flock-cli --"

[env]
# whisper-rs-sys 0.13 forwards CMAKE_* variables to its bundled CMake build.
# Keep Apple Silicon CPU targeting consistent in local, CI and release builds.
CMAKE_PROJECT_INCLUDE = { value = "cmake/whisper-apple-arm64.cmake", relative = true }
