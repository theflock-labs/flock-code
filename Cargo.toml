[workspace]
members = [
    "crates/flock-core",
    "crates/flock-tui",
    "crates/flock-pty",
    "crates/flock-cli",
    "crates/flock-kg",
    "crates/flock-mcp",
    "apps/flock-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.8.3"
authors = ["the flock authors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"

# PTY
portable-pty = "0.9"

# Persistence
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "postgres", "runtime-tokio", "macros", "migrate", "uuid", "chrono"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Local embeddings (bge-small-en-v1.5) for the graph's hybrid search.
# Text models only — the default image-models feature is dead weight here.
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
vt100 = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Memory efficiency
bytes = "1"

# Internal crates
flock-core = { path = "crates/flock-core" }
flock-tui = { path = "crates/flock-tui" }
flock-pty = { path = "crates/flock-pty" }
flock-kg = { path = "crates/flock-kg" }

# sqlx-sqlite 0.9.0, unmodified except for one line: its libsqlite3-sys bound
# is relaxed from <0.38 to <0.40, the change upstream merged on 2026-11-08
# (launchbadge/sqlx#4502) but has not released yet. That lets the bundled
# SQLite move to 3.54 (libsqlite3-sys 0.39), which fixes RUSTSEC-2026-0459 /
# CVE-2026-119375 (uninitialized page-cache memory from a crafted -wal pair).
# Remove this patch and vendor/sqlx-sqlite as soon as a sqlx-sqlite release
# allows libsqlite3-sys 0.39. See vendor/sqlx-sqlite/FLOCK_PATCH.md.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
