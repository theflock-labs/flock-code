<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 4" role="presentation">
  <!-- The crest as a rule: sky, rose, peach, in that order, together. -->
  <defs>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62ACFF"/>
      <stop offset="0.5" stop-color="#F2A8C4"/>
      <stop offset="1" stop-color="#FDB89B"/>
    </linearGradient>
  </defs>
  <rect width="480" height="4" rx="2" fill="url(#crest)"/>
</svg>
